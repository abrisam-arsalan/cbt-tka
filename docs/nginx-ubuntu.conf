# ============================================================
# Nginx untuk CBT TKA Sekolah (Ubuntu + php8.3-fpm)
# Letakkan di /etc/nginx/sites-available/cbt-tka
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name cbt.sekolahanda.sch.id;

    root /var/www/cbt-tka/public;
    index index.php;

    # Ukuran unggah: import soal maks 5 MB + margin.
    client_max_body_size 20m;

    charset utf-8;

    access_log /var/log/nginx/cbt-tka.access.log;
    error_log  /var/log/nginx/cbt-tka.error.log;

    # -----------------------------------------------------
    # File statis (cache lama, lewati PHP)
    # -----------------------------------------------------
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -----------------------------------------------------
    # Blokir akses file tersembunyi
    # -----------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # -----------------------------------------------------
    # Laravel front controller
    # -----------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -----------------------------------------------------
    # PHP via unix socket php8.3-fpm
    # -----------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";

        # Timeout longgar untuk HDD/import soal.
        fastcgi_read_timeout 300;

        include fastcgi_params;
    }
}
